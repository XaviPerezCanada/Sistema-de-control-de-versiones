<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Curso: JS + HTML Interacciones</title>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <header>
    <h1>JS + HTML Interacciones</h1>
    <!-- Añadimos atributos al navbar, unos  botones para cambiar imagen y otro para alternar el atributo del titulo, tambien impementamos un script del js-->
    <nav>
      <a href="#atributos-html">Modificar atributos HTML</a>

        <section id="atributos-html">
        <h2>Modificar atributos HTML</h2>
        <img id="img-demo" src="https://via.placeholder.com/200" alt="Imagen demo" />
        <div>
            <button id="btn-cambiar-src">Cambiar imagen</button>
            <button id="btn-toggle-title">Alternar atributo title</button>
        </div>
</section>
    </nav>
  </header>

  <main id="home">
    <h2>Bienvenido</h2>
    <p>Este curso enseña JavaScript aplicado a interacciones con elementos HTML.</p>
  </main>
  
  <p id="demo">JavaScript can change HTML content.</p>

    <button type="button" onclick='document.getElementById("demo").innerHTML = "Hello JavaScript!"'>Click Me!</button>


  <footer>
    <small>© 2025 — Curso JS Interacciones</small>
  </footer>
  <script src="assets/script.js"></script>
</body>
</html>
